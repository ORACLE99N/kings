<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KINGSMEN</title>
  <link rel="stylesheet" href="opening.css">
  <link rel="stylesheet" href="load.css">
  <link rel="icon" type="image/jpg" href="logo.jpg">

</head>

<body>
  <div id="top-loader"></div>
  <a href="home.html" class="enter-btn-link">
    <div class="km">
      <span class="enter-btn">ENTER</span>
    </div>
  </a>

  <div id="lobby-toast">
    WELCOME TO THE LOBBY
  </div>

  <script>
    function showLobbyToast() {
      const toast =
        document.getElementById("lobby-toast");
      toast.classlist.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 6000);
    }

    window.onload = showLobbyToast;
  </script>

  <script src="loader.js"></script>

</body>
